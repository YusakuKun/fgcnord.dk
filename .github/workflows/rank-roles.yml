name: Sync Discord rang-roller (kvartalsvis)

on:
  schedule:
    - cron: "17 9 1 1,4,7,10 *" # 1. jan/apr/jul/okt kl. 09:17 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Kald sync-endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_KEY }}" \
            https://fgcnord.dk/api/admin/sync-rank-roles)
          if [ "$code" != "200" ]; then echo "::error::Sync fejlede med HTTP $code"; exit 1; fi
